<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes drawStroke {
      0% {
        stroke-dashoffset: 2000;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }
    @keyframes fadeInFill {
      0% {
        fill-opacity: 0;
      }
      75% {
        fill-opacity: 0;
      }
      100% {
        fill-opacity: 1;
      }
    }
    .logo-path {
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      fill-opacity: 0;
    }
    
    .logo-base {
      stroke: #64B5F6;
      fill: #64B5F6;
      animation: 
        drawStroke 2s cubic-bezier(0.4, 0, 0.2, 1) forwards,
        fadeInFill 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: 0s;
    }
    
    .logo-magnifier {
      stroke: #64B5F6;
      fill: #64B5F6;
      animation: 
        drawStroke 2s cubic-bezier(0.4, 0, 0.2, 1) forwards,
        fadeInFill 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: 0.2s;
    }
    
    .logo-highlight {
      stroke: #64B5F6;
      fill: #64B5F6;
      animation: 
        drawStroke 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards,
        fadeInFill 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: 0.8s;
    }
    
    .logo-graph-line {
      stroke: #64B5F6;
      fill: #64B5F6;
      animation: 
        drawStroke 2s cubic-bezier(0.4, 0, 0.2, 1) forwards,
        fadeInFill 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: 0.4s;
    }
    
    .logo-bar-1 {
      stroke: #64B5F6;
      fill: #64B5F6;
      animation: 
        drawStroke 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards,
        fadeInFill 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: 0.7s;
    }
    
    .logo-bar-2 {
      stroke: #64B5F6;
      fill: #64B5F6;
      animation: 
        drawStroke 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards,
        fadeInFill 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: 0.9s;
    }
    
    .logo-arrow-tail {
      stroke: #64B5F6;
      fill: #64B5F6;
      animation: 
        drawStroke 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards,
        fadeInFill 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      animation-delay: 1.1s;
    }
  </style>

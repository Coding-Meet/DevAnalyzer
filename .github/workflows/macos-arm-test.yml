name: macOS ARM Test Build (Local QA)

on:
  workflow_dispatch:

jobs:
  build:
    name: macOS ARM Test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Inject QA props
        shell: bash
        env:
          SENTRY_DNS: ${{ secrets.SENTRY_DNS }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          UPDATER_URL: ${{ vars.UPDATER_URL }}
          FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
        run: |
          echo "is_release=true" > composeApp/src/jvmMain/resources/props.properties
          echo "sentry_dns=$SENTRY_DNS" >> composeApp/src/jvmMain/resources/props.properties
          echo "version=1.2.0" >> composeApp/src/jvmMain/resources/props.properties
          echo "enable_analytics=true" >> composeApp/src/jvmMain/resources/props.properties
          echo "enable_sentry=true" >> composeApp/src/jvmMain/resources/props.properties
          echo "posthog_api_key=$POSTHOG_API_KEY" >> composeApp/src/jvmMain/resources/props.properties
          echo "posthog_host=$POSTHOG_HOST" >> composeApp/src/jvmMain/resources/props.properties
          echo "updater_url=$UPDATER_URL" >> composeApp/src/jvmMain/resources/props.properties
          echo "feedback_url=$FEEDBACK_URL" >> composeApp/src/jvmMain/resources/props.properties

      - name: Build macOS ARM DMG
        run: ./gradlew packageReleaseDistributionForCurrentOS --stacktrace

      - name: Rename DMG
        run: |
          FILE=$(find composeApp/build/compose/binaries -name "*.dmg")
          mv "$FILE" "$(dirname "$FILE")/DevAnalyzer-test-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm-test
          path: composeApp/build/compose/binaries/**/dmg/*.dmg
